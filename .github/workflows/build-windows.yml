name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      selftest:
        description: "GUI 스모크 판정 자체검증(일부러 죽는 exe 가 FAIL 로 잡히는지)"
        type: boolean
        default: false

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    # static = 제출본(정적 모드 전용, playwright 미포함) / render = 참고본(Edge 렌더 비교용 Playwright 드라이버 포함)
    name: build (${{ matrix.variant }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: static
            reqs: build/requirements-build.txt
            static_only: "1"
            zip: IllegalAdDetector-windows.zip
            artifact: IllegalAdDetector-windows
          - variant: render
            reqs: build/requirements-build-render.txt
            static_only: "0"
            zip: IllegalAdDetector-windows-render.zip
            artifact: IllegalAdDetector-windows-render
    env:
      IAD_STATIC_ONLY: ${{ matrix.static_only }}
    steps:
      - uses: actions/checkout@v5

      - name: src 준비 여부 확인
        id: check
        run: |
          if ((Test-Path src/run_gui.py) -and (Test-Path src/requirements.txt)) {
            "ready=true" >> $env:GITHUB_OUTPUT
          } else {
            "ready=false" >> $env:GITHUB_OUTPUT
            Write-Host "::warning::src/run_gui.py 또는 src/requirements.txt 가 아직 없어 빌드를 건너뜁니다."
          }

      - uses: actions/setup-python@v6
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/requirements.txt
            build/requirements-build*.txt

      - name: 의존성 설치
        if: steps.check.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt
          python -m pip install -r ${{ matrix.reqs }}
          python -m pip list

      - name: 단위 테스트(있으면)
        if: steps.check.outputs.ready == 'true' && hashFiles('src/tests/**/*.py') != ''
        continue-on-error: true
        working-directory: src
        run: python -m pytest -q

      - name: PyInstaller 빌드 (onedir, GUI + CLI)
        if: steps.check.outputs.ready == 'true'
        run: |
          pyinstaller build/iad.spec --noconfirm --clean --distpath build/dist --workpath build/work
          Get-ChildItem build/dist/IllegalAdDetector | Format-Table Name, Length
          $hasPw = Test-Path build/dist/IllegalAdDetector/_internal/playwright
          Write-Host "variant=${{ matrix.variant }} playwright 포함=$hasPw"
          if ($env:IAD_STATIC_ONLY -eq "1" -and $hasPw) { throw "정적 전용 빌드에 playwright 가 들어감" }
          if ($env:IAD_STATIC_ONLY -ne "1" -and -not $hasPw) { throw "렌더 포함 빌드에 playwright 드라이버가 없음" }

      - name: 스모크 테스트 (한글 경로에 복사해서 실행)
        if: steps.check.outputs.ready == 'true'
        run: |
          $kdir = Join-Path $env:RUNNER_TEMP ("한글 경로" + [IO.Path]::DirectorySeparatorChar + "불법광고 탐지기")
          New-Item -ItemType Directory -Force -Path $kdir | Out-Null
          Copy-Item -Recurse -Force build/dist/IllegalAdDetector/* $kdir
          $out = Join-Path $env:RUNNER_TEMP "스모크 결과"
          try {
            ./build/smoke_cli.ps1 -AppDir $kdir -FixturesDir src/fixtures -OutDir $out -ExpectRenderFallback:($env:IAD_STATIC_ONLY -eq "1")
            if ($LASTEXITCODE -ne 0) { throw "CLI 스모크 실패" }
            ./build/smoke_gui.ps1 -Exe (Join-Path $kdir "IllegalAdDetector.exe") -WorkDir (Join-Path $out "gui")
            if ($LASTEXITCODE -ne 0) { throw "GUI 스모크 실패" }
          } finally {
            # 실패해도 로그·result.json 을 smoke-output artifact 로 남긴다
            New-Item -ItemType Directory -Force -Path build/smoke_out | Out-Null
            if (Test-Path $out) { Copy-Item -Recurse -Force "$out/*" build/smoke_out/ }
            foreach ($n in "result.json", "result_extra.json") {
              $f = Join-Path $kdir $n
              if (Test-Path -LiteralPath $f) { Copy-Item -LiteralPath $f -Destination build/smoke_out/ -Force }
            }
          }

      - name: 실행 캡처 3장 (제출본)
        if: steps.check.outputs.ready == 'true' && matrix.variant == 'static'
        continue-on-error: true
        run: |
          $kdir = Join-Path $env:RUNNER_TEMP ("한글 경로" + [IO.Path]::DirectorySeparatorChar + "불법광고 탐지기")
          ./build/capture_gui.ps1 -AppDir $kdir -OutDir build/captures
          if ($LASTEXITCODE -ne 0) { throw "캡처 일부 실패" }

      - uses: actions/upload-artifact@v6
        if: always() && steps.check.outputs.ready == 'true' && matrix.variant == 'static'
        with:
          name: captures-static
          path: build/captures/
          if-no-files-found: ignore

      - name: 산출물 zip
        if: steps.check.outputs.ready == 'true'
        run: |
          Compress-Archive -Path build/dist/IllegalAdDetector -DestinationPath build/${{ matrix.zip }} -Force
          Get-Item build/${{ matrix.zip }} | Format-Table Name, Length

      - uses: actions/upload-artifact@v6
        if: steps.check.outputs.ready == 'true'
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.zip }}
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v6
        if: always() && steps.check.outputs.ready == 'true'
        with:
          name: smoke-output-${{ matrix.variant }}
          path: build/smoke_out/
          if-no-files-found: ignore

  gui-smoke-selftest:
    if: github.event_name == 'workflow_dispatch' && inputs.selftest
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r build/requirements-build.txt
      - name: 셀프테스트 exe 빌드
        run: |
          foreach ($n in "good_gui", "bad_gui") {
            pyinstaller build/selftest/$n.py --windowed --onedir --noconfirm --name $n `
              --runtime-hook build/hooks/rth_iad.py --distpath build/dist_selftest --workpath build/work_selftest
          }
      - name: good 은 PASS, bad 는 FAIL 이어야 함
        run: |
          ./build/smoke_gui.ps1 -Exe build/dist_selftest/good_gui/good_gui.exe -TimeoutSec 40
          if ($LASTEXITCODE -ne 0) { throw "good_gui 가 FAIL 로 판정됨 (판정 로직 오류)" }
          ./build/smoke_gui.ps1 -Exe build/dist_selftest/bad_gui/bad_gui.exe -TimeoutSec 30
          if ($LASTEXITCODE -eq 0) { throw "bad_gui 가 PASS 로 판정됨 (거짓 통과)" }
          Write-Host "셀프테스트 통과: 판정 로직이 크래시를 잡아낸다"
          exit 0
